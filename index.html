<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Future Window</title>
    <link rel="stylesheet" href="SpaceApp.css">
</head>

<body>
    <canvas id="space-canvas"></canvas>

    <main class="app-shell">
        <section class="command-panel" aria-label="Orbital command panel">
            <button class="theme-toggle" type="button" aria-pressed="false">PINK</button>
            <h1>THE VOID</h1>
            <p class="status">NEBULA LINK: STABLE</p>
            <p class="message">Floating above the purple edge of deep space.</p>
            <button class="engage-button" type="button">ENGAGE</button>
        </section>
    </main>

    <script src="SpaceApp.js"></script>
</body>

</html>
